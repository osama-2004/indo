services:
  - type: web
    name: indusconnect
    env: node
    plan: starter
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
