# Force Node 20 for Vite 8 and react-router-dom 7 compatibility
# Build cache bust: 2026-05-27T18:11
[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

[phases.install]
cmds = [
  "npm install",
  "npm run build",
  "cd server && npm install"
]

[start]
cmd = "node server/index.js"
